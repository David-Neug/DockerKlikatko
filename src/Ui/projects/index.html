<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Běžící compose projekty</title>
  <link rel="stylesheet" href="../common/styles.css">
  <link rel="stylesheet" href="projects.css">
</head>
<body>
  <div class="window">
    <div id="composeInfo" class="compose-info">Načítám běžící kontejnery…</div>
    <div id="gridContainer" class="grid-container" tabindex="0">
      <table class="grid">
        <colgroup>
          <col><col><col><col><col>
        </colgroup>
        <thead>
          <tr>
            <th>Projekt / kontejner</th>
            <th>Složka / image</th>
            <th>Stav</th>
            <th>Porty na hostu</th>
            <th>Konflikt s načteným compose</th>
          </tr>
        </thead>
        <tbody id="projectsBody"></tbody>
      </table>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="legend-sample own"></span>Projekt načtený v hlavním okně</span>
      <span class="legend-item"><span class="legend-sample conflict"></span>Drží porty načteného compose</span>
    </div>
    <div class="button-bar">
      <button id="stopButton" class="danger" title="docker compose -p &lt;projekt&gt; stop. Kontejnery se zastaví, ale nesmažou, a uvolní porty. Compose soubor projektu není potřeba.">Zastavit projekt</button>
      <button id="refreshButton">Obnovit</button>
      <span id="statusLabel" class="status">Připraveno</span>
      <button id="closeButton">Zavřít</button>
    </div>
  </div>
  <script src="../common/ui.js"></script>
  <script src="projects.js"></script>
</body>
</html>
